# LR sweep (decoder-only 80%, pure CE (mode=encoder_ce, kein Teacher-Forward; Mode-Name historisch = 'CE-only')) — Experiment_Redo_TODO.md #2/#3, Phase A, Nachtrag.
# Grid-Rand-Erweiterung ueber 5e-3 hinaus: der Decoder-CE-Sweep steigt bis zum
# bisherigen Rand monoton (5e-4: 0.5032, 1e-3: 0.5036, 5e-3: 0.5045) -- selbst
# nach dem 3-Seed-Robustheits-Check von 5e-3 (0.5056 ± 0.0018, nicht
# vorzeichenkonsistent gegen 1e-3) bleibt offen, ob die Kurve jenseits von 5e-3
# noch weiter steigt oder dort kippt. Dieser Punkt prueft eine weitere Dekade,
# um den bisherigen Rand-Wert (5e-3) direkt von beiden Seiten einzurahmen,
# statt nur die Seed-Robustheit der schon getesteten Punkte zu pruefen.
# Erwartung: bei LR=1e-2 auf bereits vortrainierten Gewichten ist Instabilitaet
# plausibel -- CE gewinnt ohnehin nicht die Loss-Ablation, daher hat ein
# schlechteres Ergebnis hier keine Konsequenzen fuer die restliche Arbeit.
# WICHTIG: Sweep-Vergleich auf bestem Val-FENSE, nie auf val_loss und nie auf test.
# num_epochs=20 fix (identischer Cosine-Schedule wie alle anderen Phase-A-Sweeps).
# Run: mc-train-kd --config experiments/kd/sweep/decoder_ce_lr/lr_1e-2/config.yaml

model: conette
dataset: clotho
seed: 42

pruning:
  score_mode: wanda
  num_calibration_batches: 128
  global_pruning_ratio: null
  decoder_pruning_ratio: 0.8
  convnext_3072_threshold: null
  convnext_1536_threshold: null

kd:
  mode: encoder_ce
  train_components: decoder
  lr: 1e-2
  lr_encoder: 1.0e-6  # unused (encoder frozen)
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 64
  patience: 999  # early stopping disabled for clean full-length runs
  warmup_epochs: 2
  save_dir: experiments/kd/sweep/decoder_ce_lr/lr_1e-2

data_folder: data/
model_folder: model/
