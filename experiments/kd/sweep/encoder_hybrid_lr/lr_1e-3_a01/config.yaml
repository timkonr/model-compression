# Hybrid-alpha-Bracket (encoder-only 60%, hybrid alpha=0.1) — Nachtrag zum Mini-Check.
# Bisher wurde alpha=0.1 nur an einem einzigen LR-Punkt getestet (5e-4, uebernommen vom
# pure_kd-Gewinner, siehe lr_5e-4_a01/config.yaml). Dieser Lauf ergaenzt einen echten
# Bracket um diesen Punkt (1e-4 / 5e-4 / 1e-3), um zu pruefen, ob 5e-4 auch bei alpha=0.1
# tatsaechlich das Optimum ist, statt es nur vom pure-KD-Sweep zu uebernehmen.
# WICHTIG: Sweep-Vergleich auf bestem Val-FENSE, nie auf val_loss und nie auf test.
# num_epochs=20 fix (identischer Cosine-Schedule wie alle anderen Phase-A-Sweeps).
# Run: mc-train-kd --config experiments/kd/sweep/encoder_hybrid_lr/lr_1e-3_a01/config.yaml

model: conette
dataset: clotho
seed: 42

pruning:
  score_mode: wanda
  num_calibration_batches: 128
  global_pruning_ratio: 0.6
  decoder_pruning_ratio: null
  convnext_3072_threshold: null
  convnext_1536_threshold: null

kd:
  mode: hybrid
  train_components: encoder
  alpha: 0.1
  lr: 1.0e-4  # unused (decoder frozen)
  lr_encoder: 1e-3
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 64
  patience: 999  # early stopping disabled for clean full-length runs
  warmup_epochs: 2
  save_dir: experiments/kd/sweep/encoder_hybrid_lr/lr_1e-3_a01

data_folder: data/
model_folder: model/
