# LR sweep (encoder-only 60%, mode=encoder_ce) — Experiment_Redo_TODO.md #2/#3, Phase A, Nachtrag.
# Grid-Rand-Erweiterung ueber 5e-3 hinaus: der CE-Sweep steigt bis zum bisherigen
# Rand monoton (1e-4: 0.4972, 5e-4: 0.5008, 1e-3: 0.5028, 5e-3: 0.5033 @20ep) --
# selbst nach dem 3-Seed-Robustheits-Check von 5e-3 (0.5028 ± 0.0006, nicht
# vorzeichenkonsistent gegen 1e-3) bleibt offen, ob die Kurve jenseits von 5e-3
# noch weiter steigt oder dort kippt. Dieser Punkt prueft eine weitere Dekade,
# um den bisherigen Rand-Wert (5e-3) direkt von beiden Seiten einzurahmen,
# statt nur die Seed-Robustheit der schon getesteten Punkte zu pruefen.
# Erwartung: bei LR=1e-2 auf bereits vortrainierten Gewichten ist Instabilitaet
# plausibel (vgl. Pellegrini et al. 2023: max LR=4e-3 selbst beim ConvNeXt-
# AudioSet-Pretraining von Grund auf) -- CE gewinnt ohnehin nicht die
# Loss-Ablation, daher hat ein schlechteres Ergebnis hier keine Konsequenzen
# fuer die restliche Arbeit.
# WICHTIG: Sweep-Vergleich auf bestem Val-FENSE, nie auf val_loss und nie auf test.
# num_epochs=20 fix (identischer Cosine-Schedule wie alle anderen Phase-A-Sweeps).
# Run: mc-train-kd --config experiments/kd/sweep/encoder_ce_lr/lr_1e-2_ep20/config.yaml

model: conette
dataset: clotho
seed: 42

pruning:
  score_mode: wanda
  num_calibration_batches: 128
  global_pruning_ratio: 0.6
  decoder_pruning_ratio: null
  convnext_3072_threshold: null
  convnext_1536_threshold: null

kd:
  mode: encoder_ce
  train_components: encoder
  lr: 1.0e-4  # unused (decoder frozen)
  lr_encoder: 1e-2
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 64
  patience: 999  # early stopping disabled for clean full-length runs
  warmup_epochs: 2
  save_dir: experiments/kd/sweep/encoder_ce_lr/lr_1e-2_ep20

data_folder: data/
model_folder: model/
