# KLD-vs-CE Loss-Ablation (Todo #3, Phase B, Nachtrag) — encoder-only 60%, pure CE, LR=5e-3, seed 43.
# Ergaenzt encoder_ce_5e3 auf 3 Seeds: Der Seed-42-Punkt existiert bereits als
# experiments/kd/sweep/encoder_ce_lr/lr_5e-3_ep20 (Val-FENSE 0.5033) und wird direkt
# als Seed-42-Ablationslauf wiederverwendet (identische Bedingungen, keine Wiederholung).
# Grund fuer den Nachtrag: Der bisherige Gewinner (1e-3, 0.5028) war NICHT das Maximum
# des eigenen Sweeps -- 5e-3 lag mit 0.5033 hoeher. Begruendung im bisherigen
# encoder_ce/seed_43/config.yaml: "Plateau 1e-3..5e-3, delta unter Rauschband ~0.003 ->
# niedrigerer, beidseitig eingerahmter Punkt statt Grid-Rand" -- eine plausible, aber nie
# mit echten Seeds bei 5e-3 selbst ueberprüfte Annahme. Dieser Nachtrag testet direkt,
# ob der Grid-Rand (5e-3) trotz der Rand-Vorsicht robust besser ist oder ob sich die
# Plateau-Interior-Logik (1e-3) bestaetigt.
# Achse: Loss (mode/alpha) x Komponente x 3 Seeds, jeder Loss an seiner EIGENEN
# Gewinner-LR-Kandidatur. Vergleich NUR auf Val-FENSE der Best-Checkpoints, nicht auf
# val_loss. Gleicher Seed = identisch geprunter Student -> Vergleiche gepaart.
# Run: mc-train-kd --config experiments/kd/ablation/loss/encoder_ce_5e3/seed_43/config.yaml

model: conette
dataset: clotho
seed: 43

pruning:
  score_mode: wanda
  num_calibration_batches: 128
  global_pruning_ratio: 0.6
  decoder_pruning_ratio: null
  convnext_3072_threshold: null
  convnext_1536_threshold: null

kd:
  mode: encoder_ce
  train_components: encoder
  lr: 1.0e-4  # unused (decoder frozen)
  lr_encoder: 5e-3
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 64
  patience: 999  # volle 20 Epochen, einheitliches Budget vermeidet Selektionsbias
  warmup_epochs: 2
  save_dir: experiments/kd/ablation/loss/encoder_ce_5e3/seed_43

data_folder: data/
model_folder: model/
