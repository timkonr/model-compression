# Loss-LR-Screen fuer die geplante KLD-vs-Hybrid-n=7-Serie auf dem kombiniert
# geprunten Modell (Enc70% + Dec90%, target=all) — Nachtrag.
# Candidate 1/2 fuer die Hybrid-Konfiguration: alpha=0.1 (Decoder-Gewinner-Alpha,
# am Encoder bei 5e-4 ebenfalls konkurrenzfaehig zu alpha=0.5) mit lr_encoder=5e-4
# (Encoder-alpha=0.1-Gewinner-LR aus dem Einzelkomponenten-Sweep). Wird gegen
# hybrid_a05 (alpha=0.5, lr_encoder=1e-3) verglichen; die bessere Kombination
# geht in die finale n=7-Serie. Decoder-LR fix bei 5e-4.
# WICHTIG: Vergleich auf bestem Val-FENSE, nie auf val_loss und nie auf test.
# Run: mc-train-kd --config experiments/kd/ablation/combo/enc70_dec90/loss_lr_screen/hybrid_a01/seed_42/config.yaml

model: conette
dataset: clotho
seed: 42

pruning:
  score_mode: wanda
  num_calibration_batches: 128
  global_pruning_ratio: 0.7
  decoder_pruning_ratio: 0.9
  convnext_3072_threshold: null
  convnext_1536_threshold: null

kd:
  mode: hybrid
  train_components: all
  alpha: 0.1
  lr: 5e-4
  lr_encoder: 5e-4
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 64
  patience: 999  # early stopping disabled for clean full-length runs
  warmup_epochs: 2
  save_dir: experiments/kd/ablation/combo/enc70_dec90/loss_lr_screen/hybrid_a01/seed_42

data_folder: data/
model_folder: model/
