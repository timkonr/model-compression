# Kombi-Ablation (Todo #4, Stufe 3) — encoder@70 % + decoder@90 % kombiniert geprunt,
# Distill-Ziel: all (beide Komponenten, getrennte LR-Gruppen), seed 46.
# n=7-Serie fuer den KLD-vs-Hybrid-Vergleich auf dem finalen Kombi-Modell (Nachtrag,
# ausgeloest durch die Sorge, dass n=3 fuer eine echte statistische Aussage zu wenig ist).
# Encoder-LR 5e-4 im Screening bestaetigt (gegen 1e-3 getestet, 5e-4 blieb besser) --
# Config-identisch zu seed_42/43/44, nur zusaetzlicher Seed fuer mehr Power.
# Fixiert aus Todo #3: pure_kd, LR je Komponente 5e-4, 20 Epochen, Val-FENSE-Selektion.
# Run: mc-train-kd --config experiments/kd/ablation/combo/enc70_dec90/target_all/seed_46/config.yaml

model: conette
dataset: clotho
seed: 46

pruning:
  score_mode: wanda
  num_calibration_batches: 128
  global_pruning_ratio: 0.7
  decoder_pruning_ratio: 0.9
  convnext_3072_threshold: null
  convnext_1536_threshold: null

kd:
  mode: pure_kd
  train_components: all
  alpha: 0.0
  lr: 5e-4  # Gewinner decoder_kd_lr-Sweep
  lr_encoder: 5e-4  # im Kombi-Screening gegen 1e-3 bestaetigt
  num_epochs: 20
  batch_size: 8
  grad_accum_steps: 64
  patience: 999  # early stopping disabled for clean full-length runs
  warmup_epochs: 2
  save_dir: experiments/kd/ablation/combo/enc70_dec90/target_all/seed_46

data_folder: data/
model_folder: model/
