# Der Checkpoint existiert bereits (aus der AudioCaps-Ziehungs-Varianz-Serie).
# Checkpoint: experiments/kd/ablation/cross_domain/pruned_only/enc60_dec90/seed_44/best
# Run: python src/evaluate.py --config experiments/kd/ablation/cross_domain/eval_pruned/enc60_dec90_clotho_seed_44/config.yaml

model: conette
