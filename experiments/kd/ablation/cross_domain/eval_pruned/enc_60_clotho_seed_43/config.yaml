# Pruned-only-Evaluation (Clotho-Test) — Cross-Domain-Zerlegung, enc_60, seed 43.
# Nachtrag zu seed_42, bringt gen_decomposition.tex fuer enc_60/Clotho auf n=3.
# Checkpoint: experiments/kd/ablation/cross_domain/pruned_only/enc_60/seed_43/best
# Run: python src/evaluate.py --config experiments/kd/ablation/cross_domain/eval_pruned/enc_60_clotho_seed_43/config.yaml

model: conette
