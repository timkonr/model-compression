# Finale Test-Evaluation (SPIDEr/FENSE/METEOR auf Clotho-eval) — Scope-Ablation,
# Full-Encoder-Training @ 70 %, seed 43.
# Gegenstueck zu experiments/kd/ablation/ratio/eval/enc_70_seed_43 (surgical) — identische
# Eval-Pipeline, damit die beiden Arme direkt vergleichbar sind.
# Checkpoint: experiments/kd/ablation/scope/enc_70_full/seed_43/best
# (Architektur wird aus run_config.json neben best/ rekonstruiert — kein Wanda-Rerun.)
# Run: python src/evaluate.py --config experiments/kd/ablation/scope/eval/enc_70_full_seed_43/config.yaml

model: conette
dataset: clotho
seed: 43

technique: kd

kd:
  model_path: experiments/kd/ablation/scope/enc_70_full/seed_43/best

metrics: [spider, fense, meteor]
inference: true
evaluation: true
save_inference_results: true
data_folder: data/
model_folder: model/
